[package]
name = "fs_gui"
version = "0.1.0"
edition = "2024"

[dependencies]
fs_api = { path = "../fs_api" }
egui = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland"] }
egui_ltreeview = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
